name: Bundle Codebase

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Concatenate Codebase
        run: |
          find app/src/main -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.json" \) -not -path "*/res/mipmap*" | sort | while read -r file; do
            echo -e "\n========================================================"
            echo -e "FILE: $file"
            echo -e "========================================================\n"
            cat "$file"
          done > focusforge_full_codebase.txt

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codebase-bundle
          path: focusforge_full_codebase.txt
